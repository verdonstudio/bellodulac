<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Commerces & services — Bell'O du Lac™ & Bell'Étoile™</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="analytics.js"></script>
<script src="pois.js"></script>
<script src="logements.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --c-bg:        #fdfbf7;
        --c-ink:       #1e293b;
        --c-muted:     #64748b;
        --c-primary:   #0284c7;
        --c-primary-2: #0369a1;
        --c-primary-soft: #f0f9ff;
        --c-border:    rgba(14, 165, 233, 0.1);
        --c-card:      #ffffff;
    }
    html, body {
        background: linear-gradient(180deg, #fdfbf7 0%, #fff7ed 100%);
        min-height: 100vh;
    }
    body { font-family: 'Inter', sans-serif; margin: 0; color: var(--c-ink); }
    .font-display { font-family: 'Fraunces', Georgia, serif; letter-spacing: -0.01em; }

    .topbar {
        background-color: rgba(253, 251, 247, 0.85);
        -webkit-backdrop-filter: saturate(200%) blur(24px);
        backdrop-filter: saturate(200%) blur(24px);
        border-bottom: 1px solid rgba(0,0,0,0.05);
        z-index: 50;
    }
    .chip { transition: all 0.2s ease; }
    .chip:hover { background: var(--c-primary-soft); transform: scale(1.02); }

    .btn-back {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 6px 14px; border-radius: 999px;
        background: #f1f5f9; border: 1px solid rgba(0,0,0,0.05);
        font-size: 12px; font-weight: 600; color: #334155;
        transition: all 0.2s; text-decoration: none;
    }
    .btn-back:hover { background: #e2e8f0; color: #0f172a; }

    #content { margin-top: 56px; padding-bottom: 48px; }

    /* Vignettes "a la tv.html" : plus evidentes qu'une simple carte web -- meme gabarit que
       les tiles de l'ecran TV (icone/image, titre, QR code cliquable). 4 par ligne, comme
       demande, quelle que soit la largeur d'ecran. */
    .tile-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }

    .tile {
        display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
        background: var(--c-card); border: 3px solid transparent; border-radius: 18px;
        padding: 14px 12px; text-decoration: none; color: inherit; cursor: pointer;
        box-shadow: 0 4px 20px rgba(2,132,199,0.06);
        transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease, border-color 0.2s ease;
    }
    .tile:hover {
        transform: translateY(-3px) scale(1.01); box-shadow: 0 12px 30px rgba(2,132,199,0.16);
    }
    /* Vignette selectionnee/focus telecommande TV : encadre en orange, meme logique que le
       focus D-pad sur tv.html. La premiere vignette recoit ce focus des le chargement. */
    .tile:focus {
        outline: none; border-color: #f59e0b;
        box-shadow: 0 0 0 4px rgba(245,158,11,0.35), 0 12px 30px rgba(2,132,199,0.16);
    }
    .tile .tile-icon {
        width: 120px; height: 120px; border-radius: 22px;
        display: flex; align-items: center; justify-content: center;
        font-size: 46px; background: var(--c-primary-soft) center/cover no-repeat;
    }
    .tile .tile-title { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 15px; line-height: 1.25; color: var(--c-ink); }
    .tile .tile-distance { font-size: 12px; font-weight: 600; color: var(--c-primary-2); }
    .tile .tile-desc { font-size: 11.5px; color: var(--c-muted); line-height: 1.3; }

    .tile .qr-box {
        background: #ffffff; border-radius: 10px; padding: 5px; margin-top: 2px;
        display: flex; align-items: center; justify-content: center;
        width: 92px; height: 92px;
        border: 1px solid var(--c-border);
    }
    .tile .qr-box img { display: block; width: 80px; height: 80px; image-rendering: pixelated; }
    .qr-skeleton {
        width: 80px; height: 80px; border-radius: 6px;
        background: linear-gradient(100deg, #e2e8f0 30%, #f1f5f9 50%, #e2e8f0 70%);
        background-size: 200% 100%; animation: qr-shimmer 1.4s ease-in-out infinite;
    }
    @keyframes qr-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* QR code agrandi (modal), identique a tv.html */
    .qr-modal { position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; }
    .qr-modal__backdrop { position: absolute; inset: 0; background: rgba(30,41,59,0.55); backdrop-filter: blur(2px); }
    .qr-modal__panel {
        position: relative; background: var(--c-card); border-radius: 28px; padding: 40px 48px;
        display: flex; flex-direction: column; align-items: center; gap: 18px;
        box-shadow: 0 24px 60px rgba(0,0,0,0.35); max-width: 90vw;
    }
    .qr-modal__close {
        position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%;
        background: var(--c-primary-soft); border: none; color: var(--c-ink); font-size: 16px; cursor: pointer;
    }
    .qr-modal__close:hover, .qr-modal__close:focus { background: var(--c-primary); color: #fff; outline: none; }
    .qr-modal__title { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; color: var(--c-ink); text-align: center; }
    .qr-modal__qr-box { background: #fff; border-radius: 20px; padding: 20px; }
    .qr-modal__qr-box img { display: block; width: min(60vh, 420px); height: min(60vh, 420px); image-rendering: pixelated; }
    .qr-modal__caption { font-size: 15px; color: var(--c-muted); text-align: center; }
    /* Lien "Y aller" : ouvre l'appli de navigation choisie par l'utilisateur (voir
       buildGoToUrl), pas systematiquement Google Maps. */
    .qr-modal__go {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 10px 22px; border-radius: 999px;
        background: var(--c-primary); color: #fff; font-weight: 700; font-size: 14px;
        text-decoration: none; transition: background 0.2s ease;
    }
    .qr-modal__go:hover, .qr-modal__go:focus { background: var(--c-primary-2); outline: none; }

    #empty-state { display: none; text-align: center; padding: 40px 16px; color: var(--c-muted); font-size: 14px; }
    #empty-state.visible { display: block; }
</style>
</head>
<body>

<header class="topbar fixed top-0 w-full">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between gap-2">
        <a id="btn-back" href="index.html" class="btn-back shrink-0 shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            <span id="text-back">Retour</span>
        </a>

        <div class="flex items-center gap-2 min-w-0 flex-1 justify-center">
            <img id="topbar-logo" src="" alt="" class="w-7 h-7 rounded-full object-cover ring-1 ring-[var(--c-border)] shrink-0 hidden" />
            <span id="label-title" class="font-display font-semibold text-[14px] sm:text-[15px] truncate text-[var(--c-ink)]">Commerces &amp; services</span>
        </div>

        <select id="lang-select" class="chip text-[12px] font-medium border border-gray-200 bg-white pl-2.5 pr-7 py-1.5 rounded-full appearance-none cursor-pointer shadow-sm shrink-0" style="background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%236b7280%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22m6 9 6 6 6-6%22/></svg>'); background-repeat: no-repeat; background-position: right 8px center;">
            <option value="FR">FR</option>
            <option value="EN">EN</option>
            <option value="DE">DE</option>
            <option value="NL">NL</option>
        </select>
    </div>
</header>

<main id="content" class="max-w-5xl mx-auto px-4">

    <div class="mt-6 mb-6">
        <h1 id="page-title" class="text-2xl sm:text-3xl font-bold font-display text-[var(--c-ink)]">Commerces &amp; services</h1>
        <p id="page-subtitle" class="text-sm text-[var(--c-muted)] mt-1">Les commerces et services utiles autour de votre logement.</p>
    </div>

    <div id="shops-grid" class="tile-grid"></div>
    <p id="empty-state">—</p>

    <p class="text-[10px] text-[var(--c-muted)]/70 text-center pb-6 mt-10">© 2026 Bell'O du Lac™ & Bell'Étoile™. Tous droits réservés. Marques déposées.</p>

</main>

<!-- QR code agrandi, identique au comportement de tv.html -->
<div id="qr-modal" class="qr-modal" style="display:none;" role="dialog" aria-modal="true">
    <div class="qr-modal__backdrop" id="qr-modal-backdrop"></div>
    <div class="qr-modal__panel">
        <button id="qr-modal-close" type="button" class="qr-modal__close" aria-label="Fermer">✕</button>
        <div id="qr-modal-title" class="qr-modal__title"></div>
        <div class="qr-modal__qr-box"><img id="qr-modal-img" alt=""></div>
        <div id="qr-modal-caption" class="qr-modal__caption"></div>
        <a id="qr-modal-go" class="qr-modal__go" href="#" rel="noopener">🧭 <span id="qr-modal-go-label"></span></a>
    </div>
</div>

<script>
(function () {
    const state = { lang: 'FR', logement: 'salles6', arrivee: null, depart: null };

    const LOGO_DATA = {
        moustiers: { src: "https://bellodulac.netlify.app/images/bell-etoile-logo.png" },
        salles:    { src: "https://bellodulac.netlify.app/images/bellodulac-logo.png" }
    };

    const LISTING_ALIASES = {
        moustiers: 'moustiers', moustier: 'moustiers',
        'bell-etoile': 'moustiers', belletoile: 'moustiers', etoile: 'moustiers',
        salles6: 'salles6', 'salles-6': 'salles6', 'salles6p': 'salles6', 'salles-6p': 'salles6', bello6: 'salles6', 'bello-6': 'salles6',
        salles8: 'salles8', 'salles-8': 'salles8', 'salles8p': 'salles8', 'salles-8p': 'salles8', bello8: 'salles8', 'bello-8': 'salles8',
        salles: 'salles6'
    };
    function resolveLogement(raw) {
        const key = (raw || '').toString().trim().toLowerCase().replace(/[_\s]+/g, '-');
        return LISTING_ALIASES[key] || 'salles6';
    }
    function logoFamily(logement) {
        return (logement || '').includes('moustiers') ? 'moustiers' : 'salles';
    }

    const I18N = {
        FR: {
            back: "Retour", label: "Commerces & services",
            pageTitle: "Commerces & services",
            pageSubtitle: "Les commerces et services utiles autour de votre logement.",
            empty: "Aucun commerce référencé pour le moment.",
            scan: "Scannez avec votre téléphone",
            goThere: "Y aller",
            min: "min"
        },
        EN: {
            back: "Back", label: "Shops & services",
            pageTitle: "Shops & services",
            pageSubtitle: "Useful shops and services near your accommodation.",
            empty: "No shop listed yet.",
            scan: "Scan with your phone",
            goThere: "Get directions",
            min: "min"
        },
        DE: {
            back: "Zurück", label: "Geschäfte & Dienstleistungen",
            pageTitle: "Geschäfte & Dienstleistungen",
            pageSubtitle: "Nützliche Geschäfte und Dienstleistungen in der Nähe Ihrer Unterkunft.",
            empty: "Noch keine Geschäfte gelistet.",
            scan: "Scannen Sie mit Ihrem Handy",
            goThere: "Route planen",
            min: "Min."
        },
        NL: {
            back: "Terug", label: "Winkels & diensten",
            pageTitle: "Winkels & diensten",
            pageSubtitle: "Nuttige winkels en diensten in de buurt van uw accommodatie.",
            empty: "Nog geen winkels vermeld.",
            scan: "Scan met uw telefoon",
            goThere: "Routebeschrijving",
            min: "min"
        }
    };

    // Meme domaine que tv.html : un QR code doit encoder une URL ABSOLUE pour etre
    // ouvrable depuis l'appareil photo/scanner d'un telephone.
    const SITE_BASE_URL = 'https://bellodulac.vercel.app/';
    function toAbsoluteUrl(url) {
        if (!url) return null;
        if (/^https?:\/\//i.test(url)) return url;
        return SITE_BASE_URL + url.replace(/^\/+/, '');
    }

    function $(sel) { return document.querySelector(sel); }

    function readUrlParams() {
        const p = new URLSearchParams(window.location.search);
        const rawLang = p.get('lang') || p.get('lng');
        if (rawLang && I18N[rawLang.toUpperCase()]) state.lang = rawLang.toUpperCase();
        const rawLogement = p.get('logement') || p.get('listing') || p.get('l') || p.get('id');
        state.logement = resolveLogement(rawLogement);
        // Dates de sejour (arrivee/depart) transmises par tv.html (voir withResolvedLangAndLogement) --
        // on les recupere ici pour pouvoir les retransmettre a leur tour dans les QR code de chaque
        // commerce, afin que le contexte complet de la reservation suive le voyageur jusqu'au POI.
        state.arrivee = p.get('arrivee') || null;
        state.depart = p.get('depart') || null;
    }

    function withReservationParams(p) {
        p.set('logement', state.logement);
        p.set('lang', state.lang);
        if (state.arrivee) p.set('arrivee', state.arrivee);
        if (state.depart) p.set('depart', state.depart);
        return p;
    }

    function buildBackUrl() {
        const p = withReservationParams(new URLSearchParams());
        return `index.html?${p.toString()}`;
    }

    function poiIndexUrl(poi) {
        const p = withReservationParams(new URLSearchParams());
        p.set('poi', poi.id);
        return `index.html?${p.toString()}`;
    }

    function poiContent(poi) {
        return poi[state.lang.toLowerCase()] || poi.fr;
    }

    // -------- Distance / temps depuis le logement (a vol d'oiseau) --------
    // Meme logique que le lien "Y aller" de index.html : on estime un temps de trajet
    // indicatif sans dependre d'une API de routage externe. En dessous de 1,2 km on
    // suppose un trajet a pied (~4,5 km/h), au-dela un trajet en voiture (~45 km/h,
    // vitesse moyenne raisonnable sur les petites routes autour du lac).
    function haversineKm(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) ** 2 +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }
    function homeCoords() {
        const listing = window.LOGEMENTS_DATA && window.LOGEMENTS_DATA.listings && window.LOGEMENTS_DATA.listings[state.logement];
        return listing && listing.coords ? { lat: listing.coords.lat, lng: listing.coords.lon } : null;
    }
    function distanceInfo(poi, home) {
        if (!home || !poi.coords) return null;
        const km = haversineKm(home.lat, home.lng, poi.coords[0], poi.coords[1]);
        const speedKmh = km <= 1.2 ? 4.5 : 45;
        const minutes = Math.max(1, Math.round((km / speedKmh) * 60));
        return { km, minutes };
    }
    function formatDistanceInfo(info) {
        if (!info) return '';
        const L = I18N[state.lang];
        const kmLabel = info.km < 10 ? info.km.toFixed(1).replace('.', ',') : Math.round(info.km).toString();
        return `${kmLabel} km · ${info.minutes} ${L.min}`;
    }

    // Construit un lien d'itineraire qui laisse le choix de l'appli de navigation sur mobile
    // (Android : "geo:" fait proposer par le systeme toutes les applis installees capables de
    // le gerer, Google Maps/Waze/etc. ; iOS : maps.apple.com est le lien "universel" qu'iOS
    // redirige vers l'appli de navigation par defaut choisie par l'utilisateur), et ouvre
    // Google Maps directement sur PC/TV ou il n'y a de toute facon aucune appli native.
    // Identique a buildGoToUrl dans index.html.
    function buildGoToUrl(lat, lng, label) {
        const encLabel = encodeURIComponent(label || '');
        const ua = (navigator.userAgent || '');
        const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
        const isAndroid = /Android/i.test(ua);
        if (isAndroid) return `geo:${lat},${lng}?q=${lat},${lng}(${encLabel})`;
        if (isIOS) return `https://maps.apple.com/?daddr=${lat},${lng}&q=${encLabel}`;
        return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
    }

    function poiCategoryInfo(poi) {
        const key = poi.cat;
        const cd = key && window.POI_CATEGORIES && window.POI_CATEGORIES[key];
        if (!cd) return null;
        return { label: cd[state.lang.toLowerCase()] || cd.fr || cd.en, emoji: cd.emoji, color: cd.color };
    }

    function applyI18n() {
        const L = I18N[state.lang];
        $('#lang-select').value = state.lang;
        $('#text-back').textContent = L.back;
        $('#label-title').textContent = L.label;
        $('#page-title').textContent = L.pageTitle;
        $('#page-subtitle').textContent = L.pageSubtitle;
        $('#empty-state').textContent = L.empty;
        document.title = `${L.label} — Bell'O du Lac™ & Bell'Étoile™`;
        document.documentElement.lang = state.lang.toLowerCase();

        const family = logoFamily(state.logement);
        const logoEl = $('#topbar-logo');
        if (LOGO_DATA[family]) {
            logoEl.src = LOGO_DATA[family].src;
            logoEl.classList.remove('hidden');
        }
        $('#btn-back').href = buildBackUrl();
    }

    // -------- QR code (meme moteur que tv.html : qrcode-generator) --------
    function drawQrToCanvas(qr, cellSize, marginModules) {
        const moduleCount = qr.getModuleCount();
        const size = (moduleCount + marginModules * 2) * cellSize;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#000000';
        for (let row = 0; row < moduleCount; row++) {
            for (let col = 0; col < moduleCount; col++) {
                if (qr.isDark(row, col)) {
                    ctx.fillRect((col + marginModules) * cellSize, (row + marginModules) * cellSize, cellSize, cellSize);
                }
            }
        }
        return canvas;
    }
    function qrDataUrl(url, cellSize) {
        if (!url || typeof qrcode !== 'function') return null;
        try {
            const qr = qrcode(0, 'H');
            qr.addData(url);
            qr.make();
            return drawQrToCanvas(qr, cellSize || 4, 3).toDataURL('image/png');
        } catch (err) {
            console.warn('QR code non genere pour', url, err);
            return null;
        }
    }

    function openQrModal(titleText, url, captionText, goUrl, goLabel) {
        const modal = $('#qr-modal');
        const img = $('#qr-modal-img');
        const titleEl = $('#qr-modal-title');
        const captionEl = $('#qr-modal-caption');
        const goEl = $('#qr-modal-go');
        const goLabelEl = $('#qr-modal-go-label');
        if (!modal || !img) return;
        const dataUrl = qrDataUrl(toAbsoluteUrl(url), 10);
        if (!dataUrl) return;
        img.src = dataUrl;
        img.alt = titleText || '';
        titleEl.textContent = titleText || '';
        captionEl.textContent = captionText || '';
        // Lien "Y aller" : ouvre l'appli de navigation choisie par l'utilisateur (voir
        // buildGoToUrl), en plus du QR code qui renvoie vers la fiche du lieu sur la carte.
        if (goEl) {
            if (goUrl) {
                goEl.href = goUrl;
                goEl.style.display = 'inline-flex';
                if (goLabelEl) goLabelEl.textContent = goLabel || '';
            } else {
                goEl.style.display = 'none';
            }
        }
        modal.style.display = 'flex';
        const closeBtn = $('#qr-modal-close');
        if (closeBtn) closeBtn.focus();
    }
    function closeQrModal() {
        const modal = $('#qr-modal');
        if (!modal) return;
        modal.style.display = 'none';
    }
    $('#qr-modal-close').addEventListener('click', closeQrModal);
    $('#qr-modal-backdrop').addEventListener('click', closeQrModal);
    document.addEventListener('keydown', (e) => {
        if ((e.key === 'Escape' || e.key === 'Backspace') && $('#qr-modal').style.display !== 'none') closeQrModal();
    });

    function renderShops() {
        const L = I18N[state.lang];
        const grid = $('#shops-grid');
        const empty = $('#empty-state');
        grid.innerHTML = '';

        const pois = (window.POIS || []).filter(p => Array.isArray(p.shops) && p.shops.includes(state.logement));

        // Distance/temps depuis le logement courant, puis tri par distance croissante
        // (au lieu du tri par categorie utilise precedemment).
        const home = homeCoords();
        const withDistance = pois.map(poi => ({ poi, info: distanceInfo(poi, home) }));
        withDistance.sort((a, b) => {
            if (a.info && b.info) return a.info.km - b.info.km;
            if (a.info) return -1;
            if (b.info) return 1;
            const na = poiContent(a.poi).name || '', nb = poiContent(b.poi).name || '';
            return na.localeCompare(nb);
        });

        if (!withDistance.length) {
            empty.classList.add('visible');
            return;
        }
        empty.classList.remove('visible');

        withDistance.forEach(({ poi, info }) => {
            const content = poiContent(poi);
            const catInfo = poiCategoryInfo(poi);
            const url = poiIndexUrl(poi);
            const dataUrl = qrDataUrl(toAbsoluteUrl(url), 4);
            const distanceText = formatDistanceInfo(info);
            const goUrl = poi.coords ? buildGoToUrl(poi.coords[0], poi.coords[1], content.name || '') : null;

            // Selection plus evidente (comme sur tv.html) : l'image du commerce remplace
            // l'emoji generique de la categorie quand elle est disponible.
            const iconStyle = poi.img ? ` style="background-image:url('${poi.img}');"` : '';
            const iconContent = poi.img ? '' : (catInfo ? catInfo.emoji : '🏪');

            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.setAttribute('tabindex', '0');
            tile.setAttribute('role', 'button');
            tile.innerHTML = `
                <div class="tile-icon"${iconStyle}>${iconContent}</div>
                <div class="tile-title">${content.name}</div>
                ${distanceText ? `<div class="tile-distance">${distanceText}</div>` : ''}
                <div class="qr-box">${dataUrl ? `<img src="${dataUrl}" alt="${content.name}">` : '<div class="qr-skeleton"></div>'}</div>
                <div class="tile-desc">${L.scan}</div>
            `;
            const openModal = () => openQrModal(content.name, url, L.scan, goUrl, L.goThere);
            tile.addEventListener('click', openModal);
            tile.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(); } });
            grid.appendChild(tile);
        });

        // Pre-selectionne la premiere vignette au chargement (encadre en orange via :focus,
        // comme le focus D-pad sur tv.html) : permet de naviguer directement a la
        // telecommande sans avoir a "trouver" la premiere case au prealable. Le focus se
        // deplace ensuite naturellement d'une vignette a l'autre (Tab/fleches).
        const firstTile = grid.querySelector('.tile');
        if (firstTile) firstTile.focus();
    }

    function start() {
        readUrlParams();
        applyI18n();
        renderShops();

        $('#lang-select').addEventListener('change', (e) => {
            state.lang = e.target.value;
            applyI18n();
            renderShops();
        });
    }

    document.addEventListener('DOMContentLoaded', start);
})();
</script>
</body>
</html>
