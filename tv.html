<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bell'O du Lac™ & Bell'Étoile™ — TV</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="analytics.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Source des liens (map/evenements/highlights/panorama) pour la reservation en cours -->
<script src="redirect.js"></script>
<script src="logements.js"></script>

<!-- POI_CATEGORIES (icone/titre/couleur par categorie) : utilise pour les vignettes
     "dynamiques" (cle absente de BUILTIN_TILES, voir categoryInfoFromUrl plus bas). -->
<script src="pois.js"></script>

<!-- Fichier de correspondance "voyageur du jour" (Annonce/Nom/Arrivée/Départ/Code), utilisé
     pour reconnaitre automatiquement quelle reservation est en cours sur ce logement (la
     Google TV n'a pas de code reservation dans son URL, juste ?logement=...) et retrouver sa
     langue + ses liens (via le champ "code", cle dans redirect.js). Voir reservations.js pour
     le format et comment ajouter une entrée. -->
<script src="reservations.js"></script>

<style>
  :root {
    /* Meme palette "Vacances au bord du Lac" que index.html / home.html */
    --c-bg:        #fdfbf7;
    --c-card:      #ffffff;
    --c-ink:       #1e293b;
    --c-ink-soft:  #475569;
    --c-muted:     #64748b;
    --c-border:    rgba(14, 165, 233, 0.1);
    --c-primary:   #0284c7;
    --c-primary-2: #0369a1;
    --c-primary-soft: #f0f9ff;
    --c-accent:    #fbbf24;
    --c-warm:      #ea580c;
    --c-warm-soft: #ffedd5;
  }
  html, body {
    background: linear-gradient(180deg, #fdfbf7 0%, #fff7ed 100%);
    min-height: 100vh;
  }
  body { font-family: 'Inter', sans-serif; margin: 0; color: var(--c-ink); -webkit-font-smoothing: antialiased; }
  .font-display { font-family: 'Fraunces', Georgia, serif; font-feature-settings: "ss01"; letter-spacing: -0.01em; }

  .topbar {
    background-color: rgba(253, 251, 247, 0.85);
    -webkit-backdrop-filter: saturate(200%) blur(24px);
    backdrop-filter: saturate(200%) blur(24px);
    border-bottom: 1px solid rgba(0,0,0,0.05);
  }

  .hero {
    background: linear-gradient(135deg, #fffbeb 0%, #f0f9ff 100%);
    border-bottom: 1px solid var(--c-border);
  }

  /* repeat(4, 1fr) fixe : 8 vignettes tiennent sur 2 lignes de 4, sans avoir a scroller,
     tout en laissant a chaque vignette plus de place qu'un alignement sur une seule ligne. */
  .tile-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }

  .tile {
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px;
    background: var(--c-card); border: 1px solid var(--c-border); border-radius: 18px;
    padding: 12px 10px; text-decoration: none; color: inherit;
    box-shadow: 0 4px 20px rgba(2,132,199,0.06);
    transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease;
  }
  .tile:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 12px 30px rgba(2,132,199,0.14); }
  .tile.disabled { opacity: 0.45; pointer-events: none; }
  .tile .tile-icon {
    width: 34px; height: 34px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; background: var(--c-primary-soft);
  }
  .tile .tile-title { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 14px; line-height: 1.2; color: var(--c-ink); }
  .tile .tile-desc { font-size: 11px; color: var(--c-muted); line-height: 1.25; }
  .tile .tile-arrow { font-size: 11px; font-weight: 700; color: var(--c-primary); margin-top: auto; }

  /* padding reduit au minimum pour garder le QR code (80x80) a taille identique
     tout en reduisant l'espace total occupe par la vignette. */
  .tile .qr-box {
    background: #ffffff; border-radius: 10px; padding: 5px;
    display: flex; align-items: center; justify-content: center;
    width: 90px; height: 90px;
    border: 1px solid var(--c-border);
  }
  .tile .qr-box img { display: block; width: 80px; height: 80px; image-rendering: pixelated; }
  .qr-skeleton {
    width: 80px; height: 80px; border-radius: 6px;
    background: linear-gradient(100deg, #e2e8f0 30%, #f1f5f9 50%, #e2e8f0 70%);
    background-size: 200% 100%; animation: qr-shimmer 1.4s ease-in-out infinite;
  }
  @keyframes qr-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .data-missing {
    max-width: 640px; margin: 0 auto 20px; background:#fef2f2; border:1px solid #fecaca; color:#991b1b;
    padding:12px 16px; border-radius:12px; font-size:0.85rem;
  }

  /* QR code agrandi (vignettes "qr" en mode "modal") */
  .qr-modal { position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; }
  .qr-modal__backdrop { position: absolute; inset: 0; background: rgba(30,41,59,0.55); backdrop-filter: blur(2px); }
  .qr-modal__panel {
    position: relative; background: var(--c-card); border-radius: 28px; padding: 40px 48px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.35); max-width: 90vw;
  }
  .qr-modal__close {
    position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%;
    background: var(--c-primary-soft); border: none; color: var(--c-ink); font-size: 16px; cursor: pointer;
  }
  .qr-modal__close:hover, .qr-modal__close:focus { background: var(--c-primary); color: #fff; outline: none; }
  .qr-modal__title { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 24px; color: var(--c-ink); text-align: center; }
  .qr-modal__qr-box { background: #fff; border-radius: 20px; padding: 20px; }
  .qr-modal__qr-box img { display: block; width: min(60vh, 420px); height: min(60vh, 420px); image-rendering: pixelated; }
  .qr-modal__caption { font-size: 15px; color: var(--c-muted); text-align: center; }
</style>
</head>
<body>

<header class="topbar fixed top-0 w-full" style="z-index:50;">
  <div class="max-w-[1680px] mx-auto px-6 h-14 flex items-center gap-3">
    <img id="topbar-logo" src="" alt="" class="w-8 h-8 rounded-full object-cover ring-1 ring-[var(--c-border)] shrink-0 hidden" />
    <span id="label-title" class="font-display font-semibold text-[15px] truncate text-[var(--c-ink)]">Bell'O du Lac & Bell'Étoile</span>
  </div>
</header>

<section class="hero pt-16 pb-3 px-6 text-center">
  <h1 id="hero-title" class="font-display font-bold text-xl sm:text-2xl text-[var(--c-ink)]">—</h1>
  <p id="hero-subtitle" class="text-xs sm:text-sm text-[var(--c-muted)] mt-1 max-w-xl mx-auto">—</p>
</section>

<main class="max-w-[1680px] mx-auto px-6 pb-6">
  <div id="data-missing" class="data-missing" style="display:none;"></div>
  <div class="tile-grid" id="tile-grid"><!-- rempli en JS, a partir de config-salles.json / config-moustiers.json --></div>
</main>

<!-- QR code agrandi (vignettes "qr" en mode "modal", par defaut) : facilite le scan a distance
     depuis un fauteuil. Ferme au clic sur le fond, sur la croix, ou touche Echap/Retour. -->
<div id="qr-modal" class="qr-modal" style="display:none;" role="dialog" aria-modal="true">
  <div class="qr-modal__backdrop" id="qr-modal-backdrop"></div>
  <div class="qr-modal__panel">
    <button id="qr-modal-close" type="button" class="qr-modal__close" aria-label="Fermer">✕</button>
    <div id="qr-modal-title" class="qr-modal__title"></div>
    <div class="qr-modal__qr-box"><img id="qr-modal-img" alt=""></div>
    <div id="qr-modal-caption" class="qr-modal__caption"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const LOGEMENTS = (window.LOGEMENTS_DATA && window.LOGEMENTS_DATA.listings) || {};
  const urlParams = new URLSearchParams(window.location.search);

  // logementId : necessaire AVANT de savoir quelle reservation "matche" aujourd'hui, donc on
  // se base uniquement sur l'URL ici. En pratique, l'URL utilisee par la Google TV fournit
  // toujours ?logement=... explicitement (voir androidtv/config-salles.json /
  // config-moustiers.json, champ "url").
  const logementId = urlParams.get('logement') || (window.LOGEMENTS_DATA && window.LOGEMENTS_DATA.default) || 'moustiers';
  const listing = LOGEMENTS[logementId];

  // --- Reconnaissance de la reservation en cours via reservations.js (memes fonctions que
  // home.html), mais on recupere ici l'objet complet (nom + code) plutot que juste le nom. ---
  function todayLocalISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function parseFlexibleDate(str) {
    if (!str) return null;
    str = String(str).trim();
    let m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    return null;
  }

  function annonceMatchesLogement(annonce, targetLogementId) {
    const norm = String(annonce || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const compact = norm.replace(/[^a-z0-9]/g, '');
    if (norm === targetLogementId) return true;
    if (targetLogementId.includes('moustiers')) {
      return norm.includes('moustiers') || norm.includes('etoile');
    }
    const isSallesFamily = norm.includes('salles') || norm.includes('lac') || compact.includes('bello');
    if (!isSallesFamily) return false;
    const has6 = /\b6\b/.test(norm) || norm.includes('6p') || norm.includes('6 pers');
    const has8 = /\b8\b/.test(norm) || norm.includes('8p') || norm.includes('8 pers');
    if (targetLogementId === 'salles6' && has8) return false;
    if (targetLogementId === 'salles8' && has6) return false;
    return true;
  }

  // Heure a partir de laquelle un voyageur qui part AUJOURD'HUI n'est plus affiche (comme un
  // horaire de checkout). Utilise pour gerer les jours de "turnover" (un voyageur part le
  // matin, un autre arrive le meme jour) : le nom/langue affiches basculent de celui qui part
  // a celui qui arrive a partir de cette heure.
  const CHECKOUT_CUTOFF = '11:00';
  function currentTimeHHMM() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  function todayReservationMatch() {
    if (typeof window.RESERVATIONS === 'undefined' || !Array.isArray(window.RESERVATIONS)) return null;
    const today = todayLocalISO();
    const candidates = window.RESERVATIONS.filter(r => {
      const arrivee = parseFlexibleDate(r.arrivee);
      const depart = parseFlexibleDate(r.depart);
      if (!arrivee || !depart) return false;
      if (today < arrivee || today > depart) return false;
      return annonceMatchesLogement(r.annonce, logementId);
    });
    if (!candidates.length) return null;

    if (candidates.length === 1) {
      const only = candidates[0];
      const departsToday = parseFlexibleDate(only.depart) === today;
      const arrivesToday = parseFlexibleDate(only.arrivee) === today;
      // Un seul voyageur ce jour-la : cas normal (milieu de sejour, ou arrivee seule) -> affiche
      // toute la journee. Sauf s'il s'agit uniquement d'un depart (personne d'autre n'arrive) :
      // dans ce cas, affiche seulement jusqu'a 11h, puis bascule sur l'affichage par defaut.
      if (departsToday && !arrivesToday && currentTimeHHMM() >= CHECKOUT_CUTOFF) return null;
      return only;
    }

    // Jour de "turnover" (un depart + une arrivee le meme jour, pour ce meme logement) : le
    // voyageur qui part est affiche le matin (jusqu'a 11h), celui qui arrive prend le relais
    // a partir de 11h.
    const departing = candidates.find(r => parseFlexibleDate(r.depart) === today && parseFlexibleDate(r.arrivee) !== today);
    const arriving = candidates.find(r => parseFlexibleDate(r.arrivee) === today && parseFlexibleDate(r.depart) !== today);
    if (currentTimeHHMM() < CHECKOUT_CUTOFF) {
      if (departing) return departing;
      if (arriving) return arriving;
    } else if (arriving) {
      return arriving;
    }
    return null;
  }

  // Si un code reservation est deja fourni explicitement dans l'URL (?res=...), on ne cherche
  // pas a deviner via les dates -- comportement identique a home.html (le "res" de l'URL est
  // toujours prioritaire).
  const todaysReservation = urlParams.get('res') ? null : todayReservationMatch();
  const resCode = urlParams.get('res') || (todaysReservation && todaysReservation.code) || 'default';
  const reservationData = (typeof reservations !== 'undefined' && (reservations[resCode] || reservations['default'])) || {};

  function paramFromReservation(paramName) {
    const candidates = ['home', 'map', 'evenements', 'highlights', 'panorama'];
    for (const key of candidates) {
      const url = reservationData[key];
      if (!url) continue;
      const qs = url.split('?')[1] || '';
      const value = new URLSearchParams(qs).get(paramName);
      if (value) return value;
    }
    return null;
  }

  let lang = (urlParams.get('lang') || paramFromReservation('lang') || 'FR').toUpperCase();
  if (!['FR', 'EN', 'DE', 'NL'].includes(lang)) lang = 'FR';

  const todaysGuestName = todaysReservation ? todaysReservation.nom : null;

  // Reconstruit une URL (relative ou absolue, venant de redirect.js ou de la config Android) en
  // s'assurant qu'elle porte bien la langue resolue ci-dessus et le logement courant.
  function withResolvedLangAndLogement(url) {
    if (!url) return null;
    const [path, qs] = url.split('?');
    const p = new URLSearchParams(qs || '');
    p.set('lang', lang);
    if (!p.get('logement')) p.set('logement', logementId);
    return `${path}?${p.toString()}`;
  }

  // Les liens des vignettes (evenements.html?..., index.html?...) sont relatifs -- parfait pour
  // un clic sur la TV elle-meme (meme origine), mais un QR code doit encoder une URL ABSOLUE
  // pour etre ouvrable depuis l'appareil photo/scanner d'un telephone.
  const SITE_BASE_URL = 'https://bellodulac.vercel.app/';
  function toAbsoluteUrl(url) {
    if (!url) return null;
    if (/^https?:\/\//i.test(url)) return url; // deja absolue (ex: defaultUrl personnalisee dans la config)
    return SITE_BASE_URL + url.replace(/^\//, '');
  }

  // Ajoute (ou force) "tv=1" sur une URL relative ou absolue, sans toucher aux autres parametres.
  function withTvFlag(url) {
    if (!url) return null;
    const [path, qs] = url.split('?');
    const p = new URLSearchParams(qs || '');
    p.set('tv', '1');
    return `${path}?${p.toString()}`;
  }

  const I18N = {
    heroTitle: { FR: 'Bienvenue !', EN: 'Welcome!', DE: 'Willkommen!', NL: 'Welkom!' },
    welcomeGuest: { FR: 'Bienvenue', EN: 'Welcome', DE: 'Willkommen', NL: 'Welkom' },
    heroSubtitle: {
      FR: 'Planifiez vos activités pendant votre séjour.',
      EN: 'Plan your activities during your stay.',
      DE: 'Planen Sie Ihre Aktivitäten während Ihres Aufenthalts.',
      NL: 'Plan uw activiteiten tijdens uw verblijf.'
    },
    ouvrir: { FR: 'Ouvrir →', EN: 'Open →', DE: 'Öffnen →', NL: 'Openen →' },
    scan: { FR: 'Scannez avec votre téléphone', EN: 'Scan with your phone', DE: 'Scannen Sie mit Ihrem Handy', NL: 'Scan met uw telefoon' },
    missing: {
      FR: '⚠️ La configuration des vignettes (config-salles.json / config-moustiers.json) n’a pas pu être chargée — vignettes par défaut affichées.',
      EN: '⚠️ The tile configuration (config-salles.json / config-moustiers.json) could not be loaded — showing default tiles.',
      DE: '⚠️ Die Kachel-Konfiguration (config-salles.json / config-moustiers.json) konnte nicht geladen werden — Standardkacheln werden angezeigt.',
      NL: '⚠️ De tegelconfiguratie (config-salles.json / config-moustiers.json) kon niet worden geladen — standaardtegels worden getoond.'
    }
  };

  document.documentElement.lang = lang.toLowerCase();
  document.getElementById('hero-title').textContent = todaysGuestName
    ? (lang === 'FR' ? `${I18N.welcomeGuest.FR} ${todaysGuestName} !` : `${I18N.welcomeGuest[lang]} ${todaysGuestName}!`)
    : I18N.heroTitle[lang];
  document.getElementById('hero-subtitle').textContent = I18N.heroSubtitle[lang];

  if (listing) {
    document.getElementById('label-title').textContent = listing.brand ? (listing.brand[lang] || listing.brand.FR) : listing.id;
    const logoEl = document.getElementById('topbar-logo');
    if (listing.logo) { logoEl.src = listing.logo; logoEl.classList.remove('hidden'); }
  }

  // ==========================================================================
  // Vignettes : entierement pilotees par la config Android (config-salles.json /
  // config-moustiers.json, champ "tiles"). Ajouter une vignette = ajouter une entree
  // dans ce tableau JSON, directement sur GitHub -- aucun changement de code necessaire
  // pour les 5 vignettes "standard" ci-dessous (evenements/highlights/map/panorama/
  // backintime) : la config peut alors se limiter a {"key":"...", "type":"link"|"qr"}.
  // Pour une vignette entierement nouvelle, la config peut fournir directement "title"
  // (par langue), "icon" et "defaultUrl".
  // ==========================================================================

  function backintimeDefaultUrl(id, l) {
    const ville = id.includes('moustiers') ? 'moustiers' : 'salles';
    return `${ville}_backintime.html?logement=${encodeURIComponent(id)}&lang=${l}`;
  }

  const BUILTIN_TILES = {
    evenements: {
      icon: '📅',
      title: { FR: 'Évènements locaux', EN: 'Local events', DE: 'Lokale Veranstaltungen', NL: 'Lokale evenementen' },
      desc: {
        FR: 'Tous les évènements du coin, jour par jour.',
        EN: 'All local events, day by day.',
        DE: 'Alle Veranstaltungen der Umgebung, Tag für Tag.',
        NL: 'Alle evenementen in de omgeving, dag na dag.'
      },
      type: 'link',
      source: 'evenements',
      defaultUrl: (id, l) => `evenements.html?logement=${encodeURIComponent(id)}&lang=${l}&showevents=today`
    },
    highlights: {
      icon: '✨',
      title: { FR: 'Votre programme', EN: 'Your programme', DE: 'Ihr Programm', NL: 'Uw programma' },
      desc: {
        FR: 'Une sélection d’évènements et de lieux rien que pour vous.',
        EN: 'A selection of events and spots picked just for you.',
        DE: 'Eine Auswahl an Veranstaltungen und Orten, nur für Sie.',
        NL: 'Een selectie van evenementen en plekken speciaal voor u.'
      },
      type: 'link',
      source: 'highlights',
      defaultUrl: (id, l) => `highlights.html?logement=${encodeURIComponent(id)}&lang=${l}&showevents=today&showpois=today&from=evenements`
    },
    map: {
      icon: '🗺️',
      title: { FR: 'Carte interactive', EN: 'Interactive map', DE: 'Interaktive Karte', NL: 'Interactieve kaart' },
      desc: { FR: 'Plus de 130 lieux autour du lac et des villages.', EN: 'Over 130 spots around the lake and villages.', DE: 'Über 130 Orte rund um den See und die Dörfer.', NL: 'Meer dan 130 plekken rond het meer en de dorpen.' },
      type: 'qr',
      source: 'map',
      defaultUrl: (id, l) => `index.html?logement=${encodeURIComponent(id)}&lang=${l}`
    },
    panorama: {
      icon: '🌄',
      title: { FR: 'Panorama 360°', EN: '360° panorama', DE: '360°-Panorama', NL: '360°-panorama' },
      desc: { FR: 'Les logements et les environs en vue à 360°.', EN: 'The homes and surroundings in 360° view.', DE: 'Die Unterkünfte und die Umgebung in der 360°-Ansicht.', NL: 'De woningen en de omgeving in 360°-weergave.' },
      type: 'qr',
      source: 'panorama',
      defaultUrl: (id, l) => `panorama.html?logement=${encodeURIComponent(id)}&lang=${l}`
    },
    backintime: {
      icon: '🕰️',
      title: { FR: 'Retour vers le futur', EN: 'Back to the future', DE: 'Zurück in die Zukunft', NL: 'Terug naar de toekomst' },
      desc: { FR: 'Comparez le village et le lac d’hier à aujourd’hui.', EN: 'Compare the village and the lake, then and now.', DE: 'Vergleichen Sie das Dorf und den See von früher mit heute.', NL: 'Vergelijk het dorp en het meer van vroeger met nu.' },
      type: 'qr',
      source: null,
      defaultUrl: backintimeDefaultUrl
    },
    trash: {
      icon: '🗑️',
      title: { FR: 'Poubelles', EN: 'Bins', DE: 'Mülltonnen', NL: 'Afvalcontainers' },
      desc: { FR: 'Où déposer vos ordures pendant votre séjour.', EN: 'Where to take your rubbish during your stay.', DE: 'Wo Sie Ihren Müll während Ihres Aufenthalts entsorgen können.', NL: 'Waar u uw afval tijdens uw verblijf kunt afgeven.' },
      type: 'qr',
      source: 'trash',
      defaultUrl: (id, l) => `index.html?logement=${encodeURIComponent(id)}&lang=${l}&cat=ordures`
    }
  };

  const DEFAULT_TILES = [
    { key: 'evenements' },
    { key: 'highlights' },
    { key: 'map' },
    { key: 'panorama' },
    { key: 'backintime' }
  ];

  // Resout le lien d'une vignette : en priorite le lien de la reservation en cours (dates +
  // langue du sejour deja correctes dans redirect.js), sinon le lien par defaut (fourni par la
  // config Android, ou calcule automatiquement pour les 5 vignettes standard), sinon (vignette
  // "dynamique", cle absente de BUILTIN_TILES et sans defaultUrl fourni dans la config) le tag
  // "default" de redirect.js pour ce meme champ.
  //
  // Pour une vignette dynamique, sourceKey retombe directement sur tile.key : ajouter
  // { "key": "parking", "type": "link" } dans la config Android suffit donc a recuperer le champ
  // "parking" de redirect.js (voir reservations en cours ET tag "default"), sans avoir a le
  // redefinir ici -- aucune modification de tv.html n'est necessaire pour une nouvelle categorie.
  function resolveTileHref(tile, builtin) {
    const sourceKey = ('source' in tile) ? tile.source : (builtin ? builtin.source : tile.key);
    // 1) Reservation en cours (logique de correspondance/turnover inchangee, voir
    //    todayReservationMatch ci-dessus) : priorite absolue si le champ existe pour elle.
    if (sourceKey && resCode !== 'default' && reservationData[sourceKey]) {
      return withResolvedLangAndLogement(reservationData[sourceKey]);
    }
    // 2) Lien par defaut calcule localement (vignette standard, ou config Android avec
    //    "defaultUrl" explicite) : logement + langue toujours corrects, prefere donc au tag
    //    "default" generique de redirect.js quand il est disponible.
    let raw = tile.defaultUrl || null;
    if (!raw && builtin && typeof builtin.defaultUrl === 'function') raw = builtin.defaultUrl(logementId, lang);
    if (raw) return withResolvedLangAndLogement(raw);
    // 3) Vignette dynamique sans aucun lien local calculable : tag "default" de redirect.js.
    if (sourceKey && reservationData[sourceKey]) {
      return withResolvedLangAndLogement(reservationData[sourceKey]);
    }
    return null;
  }

  // Vignette dynamique (cle absente de BUILTIN_TILES) sans icone/titre fournis dans la config :
  // on les derive automatiquement depuis pois.js (POI_CATEGORIES), a partir de la premiere
  // categorie du parametre "cat" de l'URL resolue (ex. "cat=parking_gratuit,..." dans le lien
  // "parking" de redirect.js -> POI_CATEGORIES.parking_gratuit : icone, titre 4 langues, couleur).
  function categoryInfoFromUrl(url) {
    if (!url) return null;
    const qs = url.split('?')[1] || '';
    const catParam = new URLSearchParams(qs).get('cat');
    if (!catParam) return null;
    const firstCat = catParam.split(',')[0].trim();
    const categories = window.POI_CATEGORIES || {};
    return categories[firstCat] || null;
  }

  function drawQrToCanvas(qr, cellSize, marginModules) {
    const moduleCount = qr.getModuleCount();
    const size = (moduleCount + marginModules * 2) * cellSize;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#000000';
    for (let row = 0; row < moduleCount; row++) {
      for (let col = 0; col < moduleCount; col++) {
        if (qr.isDark(row, col)) {
          ctx.fillRect((col + marginModules) * cellSize, (row + marginModules) * cellSize, cellSize, cellSize);
        }
      }
    }
    return canvas;
  }

  function qrDataUrl(url, cellSize) {
    if (!url || typeof qrcode !== 'function') return null;
    try {
      const qr = qrcode(0, 'H');
      qr.addData(url);
      qr.make();
      return drawQrToCanvas(qr, cellSize || 4, 3).toDataURL('image/png');
    } catch (err) {
      console.warn('QR code non genere pour', url, err);
      return null;
    }
  }

  // Ouvre/ferme le QR code d'une vignette en grand format (modal), pour faciliter le scan a
  // distance -- comportement par defaut des vignettes "qr" (voir I18N.onClick / tile.onClick
  // dans la config Android : "modal" (par defaut) ou "link" pour ouvrir directement le lien
  // sur la TV au lieu d'agrandir le QR code).
  function openQrModal(titleText, url, captionText) {
    const modal = document.getElementById('qr-modal');
    const img = document.getElementById('qr-modal-img');
    const titleEl = document.getElementById('qr-modal-title');
    const captionEl = document.getElementById('qr-modal-caption');
    if (!modal || !img) return;
    const dataUrl = qrDataUrl(toAbsoluteUrl(url), 10);
    if (!dataUrl) return;
    img.src = dataUrl;
    img.alt = titleText || '';
    titleEl.textContent = titleText || '';
    captionEl.textContent = captionText || '';
    modal.style.display = 'flex';
    modal.dataset.lastFocus = document.activeElement && document.activeElement.id ? document.activeElement.id : '';
    const closeBtn = document.getElementById('qr-modal-close');
    if (closeBtn) closeBtn.focus();
  }

  function closeQrModal() {
    const modal = document.getElementById('qr-modal');
    if (!modal || modal.style.display === 'none') return;
    modal.style.display = 'none';
    const lastFocusId = modal.dataset.lastFocus;
    if (lastFocusId) {
      const el = document.getElementById(lastFocusId);
      if (el) el.focus();
    }
  }

  function renderTiles(tiles) {
    const grid = document.getElementById('tile-grid');
    grid.innerHTML = '';
    tiles.forEach((tile, i) => {
      const builtin = BUILTIN_TILES[tile.key];
      const href = resolveTileHref(tile, builtin);
      // Vignette dynamique (cle absente de BUILTIN_TILES) sans icone/titre fournis dans la
      // config Android : on les derive automatiquement depuis pois.js via l'URL resolue
      // ci-dessus (voir categoryInfoFromUrl). Inutile de calculer autoCat pour une vignette
      // standard, ou si la config fournit deja icone ET titre explicitement.
      const autoCat = (!builtin && (!tile.icon || !tile.title)) ? categoryInfoFromUrl(href) : null;
      const icon = tile.icon || (builtin && builtin.icon) || (autoCat && autoCat.emoji) || '🔗';
      const title = tile.title || (builtin && builtin.title)
        || (autoCat && { FR: autoCat.fr, EN: autoCat.en, DE: autoCat.de, NL: autoCat.nl })
        || { FR: tile.key, EN: tile.key, DE: tile.key, NL: tile.key };
      const desc = tile.desc || (builtin && builtin.desc) || { FR: '', EN: '', DE: '', NL: '' };
      const type = tile.type || (builtin && builtin.type) || 'link';
      // Couleur de categorie (pois.js) pour l'icone d'une vignette dynamique -- les vignettes
      // standard gardent leur fond neutre habituel (var(--c-primary-soft), voir CSS .tile-icon).
      const iconStyle = (autoCat && autoCat.color) ? ` style="background:${autoCat.color}22;"` : '';
      // La vignette "carte interactive" (index.html) a plus de 130 pins : une telecommande TV ne
      // peut pas viser un pin precisement. Le clic SUR LA TV (mode "link") passe donc par ?tv=1,
      // qui active une liste de POI navigable au D-pad a cote de la carte (voir index.html,
      // renderTvPoiList()). Le QR code garde toujours le lien normal, sans ce mode.
      const tvHref = (tile.key === 'map' && href) ? withTvFlag(href) : href;

      // Pour une vignette "qr" : que fait le clic SUR LA TV elle-meme (pas le scan au telephone,
      // qui utilise toujours le QR code) ? "modal" (par defaut) agrandit le QR code a l'ecran
      // pour faciliter le scan a distance ; "link" ouvre directement le lien sur la TV. Reglable
      // par vignette via la config Android (champ "onClick": "modal" | "link"). Sans effet sur
      // "qr_and_link" (voir ci-dessous), qui ouvre toujours directement le lien.
      const onClickMode = tile.onClick || (builtin && builtin.onClick) || 'modal';

      const a = document.createElement('a');
      a.id = `tile-${tile.key}-${i}`;
      a.className = 'tile' + (href ? '' : ' disabled');

      // "qr" : QR code scannable au telephone + clic sur la TV agrandit le QR (par defaut) ou
      // ouvre le lien, selon onClick.
      // "qr_and_link" : meme QR code scannable au telephone, mais le clic sur la TV ouvre
      // TOUJOURS directement le lien (jamais d'agrandissement) -- utile pour une vignette qu'on
      // veut aussi pouvoir ouvrir soi-meme sur la TV (ex. poubelles, parking).
      if (type === 'qr' || type === 'qr_and_link') {
        const dataUrl = qrDataUrl(toAbsoluteUrl(href), 4);
        // "qr" et "qr_and_link" : si une description est definie, on l'affiche au-dessus du QR
        // code.
        const descText = desc[lang] || desc.FR || '';
        const descHtml = descText ? `<div class="tile-desc">${descText}</div>` : '';
        a.innerHTML = `
          <div class="tile-icon"${iconStyle}>${icon}</div>
          <div class="tile-title">${title[lang] || title.FR}</div>
          ${descHtml}
          <div class="qr-box">${dataUrl ? `<img src="${dataUrl}" alt="${title[lang] || title.FR}">` : '<div class="qr-skeleton"></div>'}</div>
          <div class="tile-desc">${I18N.scan[lang]}</div>
        `;
        if (type === 'qr' && href && onClickMode === 'modal') {
          a.href = '#';
          a.addEventListener('click', (e) => {
            e.preventDefault();
            openQrModal(title[lang] || title.FR, href, I18N.scan[lang]);
          });
        } else {
          a.href = tvHref || '#';
        }
      } else {
        a.href = tvHref || '#';
        a.innerHTML = `
          <div class="tile-icon"${iconStyle}>${icon}</div>
          <div class="tile-title">${title[lang] || title.FR}</div>
          <div class="tile-desc">${desc[lang] || desc.FR}</div>
          <div class="tile-arrow">${I18N.ouvrir[lang]}</div>
        `;
      }
      grid.appendChild(a);
    });
  }

  // Fermeture du modal QR : croix, clic sur le fond, ou touche Echap/Retour (telecommande).
  const qrModalClose = document.getElementById('qr-modal-close');
  const qrModalBackdrop = document.getElementById('qr-modal-backdrop');
  if (qrModalClose) qrModalClose.addEventListener('click', closeQrModal);
  if (qrModalBackdrop) qrModalBackdrop.addEventListener('click', closeQrModal);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' || e.key === 'Backspace' || e.keyCode === 27 || e.keyCode === 8) {
      const modal = document.getElementById('qr-modal');
      if (modal && modal.style.display !== 'none') {
        e.preventDefault();
        closeQrModal();
      }
    }
  });

  const CONFIG_URLS = {
    salles: 'https://raw.githubusercontent.com/verdonstudio/bellodulac/main/androidtv/config-salles.json',
    moustiers: 'https://raw.githubusercontent.com/verdonstudio/bellodulac/main/androidtv/config-moustiers.json'
  };
  const propertyFamily = logementId.includes('moustiers') ? 'moustiers' : 'salles';

  async function fetchTilesConfig() {
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);
      const res = await fetch(CONFIG_URLS[propertyFamily], { signal: controller.signal, cache: 'no-store' });
      clearTimeout(timeout);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      if (Array.isArray(json.tiles) && json.tiles.length) return json.tiles;
      return DEFAULT_TILES;
    } catch (e) {
      console.warn('Config Android injoignable, vignettes par defaut utilisees.', e);
      const missingEl = document.getElementById('data-missing');
      missingEl.textContent = I18N.missing[lang];
      missingEl.style.display = 'block';
      return DEFAULT_TILES;
    }
  }

  // Affiche d'abord les vignettes "link" tout de suite (pas besoin d'attendre la config pour
  // celles-ci en mode degrade), puis remplace par la vraie config une fois recuperee.
  renderTiles(DEFAULT_TILES);
  fetchTilesConfig().then(renderTiles);
})();
</script>
</body>
</html>
