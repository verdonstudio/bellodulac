<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Redirection</title>
    
    <script src="https://gist.githack.com/verdonstudio/bf1d7d0b70d607ad4fdc086305a4af77/raw/redirect.js"></script>

    <script>
        // L'URL vers laquelle rediriger s'il n'y a pas de code ou s'il est introuvable
        const urlParDefaut = "https://bellodulac.vercel.app";

        // Récupération des paramètres de l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const numeroReservation = urlParams.get('res');
        const typeLien = urlParams.get('type') || 'highlights'; 

        // On initialise la destination avec l'URL par défaut
        let urlDestination = urlParDefaut;

        // Si un numéro est fourni et que le fichier de conf est bien chargé
        if (numeroReservation && typeof reservations !== 'undefined') {
            
            const donneesReservation = reservations[numeroReservation];

            // Si la réservation existe ET que le type de lien demandé existe
            if (donneesReservation && donneesReservation[typeLien]) {
                // On remplace l'URL par défaut par la bonne URL trouvée
                urlDestination = donneesReservation[typeLien];
            }
        }

        // On effectue la redirection dans tous les cas (vers l'URL précise ou par défaut)
        window.location.replace(urlDestination);
    </script>
</head>
<body>
</body>
</html>
