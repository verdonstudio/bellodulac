<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bienvenue — Bell'O du Lac™ & Bell'Étoile™</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="analytics.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Source des liens (map/evenements/highlights/panorama) pour la reservation en cours -->
<script src="redirect.js"></script>
<script src="logements.js"></script>

<!-- Fichier de correspondance "voyageur du jour" (Annonce/Nom/Arrivée/Départ), utilisé
     pour afficher "Bienvenue {Nom} !" sur cette page quand la date du jour tombe dans le
     séjour d'un voyageur pour ce logement (ex : Google TV, qui n'a pas de code réservation
     dans l'URL). Voir reservations.js pour le format et comment ajouter une entrée. -->
<script src="reservations.js"></script>

<style>
  :root {
    --c-bg:        #fdfbf7;
    --c-ink:       #1e293b;
    --c-muted:     #64748b;
    --c-primary:   #0284c7;
    --c-border:    rgba(14, 165, 233, 0.1);
    --c-card:      #ffffff;
  }
  body { font-family: 'Inter', sans-serif; margin: 0; background: var(--c-bg); color: var(--c-ink); }
  .font-display { font-family: 'Fraunces', Georgia, serif; letter-spacing: -0.01em; }

  .topbar {
    background-color: rgba(253, 251, 247, 0.85);
    -webkit-backdrop-filter: saturate(200%) blur(24px);
    backdrop-filter: saturate(200%) blur(24px);
    border-bottom: 1px solid rgba(0,0,0,0.05);
    z-index: 50;
  }
  .btn-back {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 999px;
    background: #f1f5f9; border: 1px solid rgba(0,0,0,0.05);
    font-size: 12px; font-weight: 600; color: #334155;
    transition: all 0.2s; text-decoration: none;
  }
  .btn-back:hover { background: #e2e8f0; color: #0f172a; }

  .hero {
    background: linear-gradient(180deg, #e0f2fe 0%, var(--c-bg) 100%);
    border-bottom: 1px solid var(--c-border);
  }

  .tile-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 900px) { .tile-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .tile-grid { grid-template-columns: 1fr; } }

  .tile {
    display: flex; flex-direction: column; gap: 10px;
    background: var(--c-card); border: 1px solid var(--c-border); border-radius: 20px;
    padding: 22px 18px; text-decoration: none; color: inherit;
    box-shadow: 0 4px 20px rgba(2,132,199,0.06);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .tile:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(2,132,199,0.14); }
  .tile .tile-icon {
    width: 52px; height: 52px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; background: #e0f2fe;
  }
  .tile .tile-title { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 17px; }
  .tile .tile-desc { font-size: 13px; color: var(--c-muted); line-height: 1.4; flex: 1; }
  .tile .tile-arrow { font-size: 13px; font-weight: 700; color: var(--c-primary); }

  .tile.disabled { opacity: 0.45; pointer-events: none; }

  .data-missing {
    max-width: 640px; margin: 24px auto; background:#fef2f2; border:1px solid #fecaca; color:#991b1b;
    padding:12px 16px; border-radius:12px; font-size:0.85rem;
  }
</style>
</head>
<body>

<header class="topbar fixed top-0 w-full">
  <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between gap-2">
    <div class="flex items-center gap-2 min-w-0">
      <img id="topbar-logo" src="" alt="" class="w-7 h-7 rounded-full object-cover ring-1 ring-[var(--c-border)] shrink-0 hidden" />
      <span id="label-title" class="font-display font-semibold text-[14px] sm:text-[15px] truncate text-[var(--c-ink)]">Bell'O du Lac & Bell'Étoile</span>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <a id="btn-selogers" href="logements.html" class="btn-back shadow-sm" style="text-decoration:none;">
        🏡 <span id="btn-selogers-label">Se loger</span>
      </a>
      <select id="lang-select" class="text-[12px] font-medium border border-gray-200 bg-white pl-2.5 pr-7 py-1.5 rounded-full appearance-none cursor-pointer shadow-sm" style="background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%236b7280%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22m6 9 6 6 6-6%22/></svg>'); background-repeat:no-repeat; background-position:right 8px center;">
        <option value="FR">FR</option>
        <option value="EN">EN</option>
        <option value="DE">DE</option>
        <option value="NL">NL</option>
      </select>
    </div>
  </div>
</header>

<section class="hero pt-20 pb-10 px-4 text-center">
  <h1 id="hero-title" class="font-display font-bold text-2xl sm:text-3xl text-[var(--c-ink)]">—</h1>
  <p id="hero-subtitle" class="text-sm sm:text-base text-[var(--c-muted)] mt-2 max-w-lg mx-auto">—</p>
</section>

<main class="max-w-5xl mx-auto px-4 pb-16 -mt-4">
  <div id="data-missing" class="data-missing" style="display:none;"></div>
  <div class="tile-grid" id="tile-grid"><!-- rempli en JS --></div>
</main>

<script>
(function () {
  'use strict';

  const LOGEMENTS = (window.LOGEMENTS_DATA && window.LOGEMENTS_DATA.listings) || {};
  const urlParams = new URLSearchParams(window.location.search);

  // logementId : necessaire AVANT de savoir quelle reservation "matche" aujourd'hui, donc on
  // se base uniquement sur l'URL ici (les liens generes dans redirect.js incluent toujours
  // "logement=" explicitement, voir url-generator.html).
  const logementId = urlParams.get('logement') || (window.LOGEMENTS_DATA && window.LOGEMENTS_DATA.default) || 'moustiers';
  const listing = LOGEMENTS[logementId];

  // --- "Bienvenue {Nom} !" : reconnaissance du voyageur du jour via reservations.js ---
  // (pense pour Google TV notamment, qui affiche home.html sans code "res" dans l'URL :
  // on ne peut pas savoir QUI regarde, seulement QUAND et sur QUEL logement.)
  function todayLocalISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  // Accepte "YYYY-MM-DD" (recommande) ou "JJ/MM/AAAA" (plus naturel a taper a la main) et
  // renvoie toujours "YYYY-MM-DD", pour que la comparaison de chaines fonctionne telle quelle.
  function parseFlexibleDate(str) {
    if (!str) return null;
    str = String(str).trim();
    let m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    return null;
  }

  // "Annonce" est un texte libre (ex: "Bell'Étoile (Moustiers)", "Bell'O du Lac 8P") : on
  // le rapproche du logement courant par mots-cles, en affinant par 6/8 personnes quand
  // c'est precise. Pour un rapprochement garanti, on peut aussi ecrire directement l'id
  // exact ("moustiers" / "salles6" / "salles8") dans le champ "annonce".
  function annonceMatchesLogement(annonce, targetLogementId) {
    const norm = String(annonce || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    // Version "compacte" (sans espaces/apostrophes/ponctuation) pour reconnaitre "Bell'O",
    // "Bell O", "Bello" etc. de la meme facon, meme si l'apostrophe casse un includes() simple.
    const compact = norm.replace(/[^a-z0-9]/g, '');
    if (norm === targetLogementId) return true;
    if (targetLogementId.includes('moustiers')) {
      return norm.includes('moustiers') || norm.includes('etoile');
    }
    const isSallesFamily = norm.includes('salles') || norm.includes('lac') || compact.includes('bello');
    if (!isSallesFamily) return false;
    const has6 = /\b6\b/.test(norm) || norm.includes('6p') || norm.includes('6 pers');
    const has8 = /\b8\b/.test(norm) || norm.includes('8p') || norm.includes('8 pers');
    if (targetLogementId === 'salles6' && has8) return false;
    if (targetLogementId === 'salles8' && has6) return false;
    return true; // pas de precision de capacite dans le texte -> on considere que ca correspond
  }

  // Heure a partir de laquelle un voyageur qui part AUJOURD'HUI n'est plus affiche (comme un
  // horaire de checkout). Utilise pour geree les jours de "turnover" (un voyageur part le
  // matin, un autre arrive le meme jour) : le nom/langue affiches basculent de celui qui part
  // a celui qui arrive a partir de cette heure.
  const CHECKOUT_CUTOFF = '11:00';
  function currentTimeHHMM() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  function todayReservationMatch() {
    if (typeof window.RESERVATIONS === 'undefined' || !Array.isArray(window.RESERVATIONS)) return null;
    const today = todayLocalISO();
    const candidates = window.RESERVATIONS.filter(r => {
      const arrivee = parseFlexibleDate(r.arrivee);
      const depart = parseFlexibleDate(r.depart);
      if (!arrivee || !depart) return false;
      if (today < arrivee || today > depart) return false;
      return annonceMatchesLogement(r.annonce, logementId);
    });
    if (!candidates.length) return null;

    if (candidates.length === 1) {
      const only = candidates[0];
      const departsToday = parseFlexibleDate(only.depart) === today;
      const arrivesToday = parseFlexibleDate(only.arrivee) === today;
      // Un seul voyageur ce jour-la : cas normal (milieu de sejour, ou arrivee seule) -> affiche
      // toute la journee. Sauf s'il s'agit uniquement d'un depart (personne d'autre n'arrive) :
      // dans ce cas, affiche seulement jusqu'a 11h, puis bascule sur l'affichage par defaut.
      if (departsToday && !arrivesToday && currentTimeHHMM() >= CHECKOUT_CUTOFF) return null;
      return only;
    }

    // Jour de "turnover" (un depart + une arrivee le meme jour, pour ce meme logement) : le
    // voyageur qui part est affiche le matin (jusqu'a 11h), celui qui arrive prend le relais
    // a partir de 11h.
    const departing = candidates.find(r => parseFlexibleDate(r.depart) === today && parseFlexibleDate(r.arrivee) !== today);
    const arriving = candidates.find(r => parseFlexibleDate(r.arrivee) === today && parseFlexibleDate(r.depart) !== today);
    if (currentTimeHHMM() < CHECKOUT_CUTOFF) {
      if (departing) return departing;
      if (arriving) return arriving;
    } else if (arriving) {
      return arriving;
    }
    return null;
  }

  const todaysReservation = urlParams.get('res') ? null : todayReservationMatch();

  // Meme logique de repli que display.html : sans "res" (ou reservation inconnue), on retombe
  // sur l'entree "default" de redirect.js plutot que de ne rien afficher. Le code de la
  // reservation reconnue via reservations.js (ci-dessus) est prioritaire sur "default" des que
  // l'URL elle-meme ne precise pas deja "res" -- ca permet a la langue et aux liens (carte,
  // evenements, programme...) de suivre automatiquement le bon voyageur.
  const resCode = urlParams.get('res') || (todaysReservation && todaysReservation.code) || 'default';
  const reservationData = (typeof reservations !== 'undefined' && (reservations[resCode] || reservations['default'])) || {};

  // Si "lang" n'est pas precise sur l'URL de home.html elle-meme (lien raccourci, saisi a la
  // main, etc.), on le retrouve dans les autres liens deja stockes pour cette reservation dans
  // redirect.js, plutot que de supposer FR.
  function paramFromReservation(paramName) {
    const candidates = ['home', 'map', 'evenements', 'highlights', 'panorama'];
    for (const key of candidates) {
      const url = reservationData[key];
      if (!url) continue;
      const qs = url.split('?')[1] || '';
      const value = new URLSearchParams(qs).get(paramName);
      if (value) return value;
    }
    return null;
  }

  let lang = (urlParams.get('lang') || paramFromReservation('lang') || 'FR').toUpperCase();
  if (!['FR', 'EN', 'DE', 'NL'].includes(lang)) lang = 'FR';

  const todaysGuestName = todaysReservation ? todaysReservation.nom : null;

  // "Retour vers le futur" (remonter le temps) : page distincte selon le secteur, comme
  // sur index.html (bouton #btn-backintime) -- moustiers_backintime.html ou
  // salles_backintime.html, avec juste lang/logement (ces pages n'ont pas besoin des
  // dates de sejour).
  function backInTimeHref() {
    const ville = logementId.includes('moustiers') ? 'moustiers' : 'salles';
    const p = new URLSearchParams();
    p.set('lang', lang);
    p.set('logement', logementId);
    return `${ville}_backintime.html?${p.toString()}`;
  }

  const TILES = [
    {
      key: 'map',
      icon: '🗺️',
      title: { FR: 'Carte interactive', EN: 'Interactive map', DE: 'Interaktive Karte', NL: 'Interactieve kaart' },
      desc: {
        FR: 'Découvrez plus de 130 lieux à visiter autour du lac et des villages.',
        EN: 'Discover more than 130 spots to visit around the lake and villages.',
        DE: 'Entdecken Sie mehr als 130 Orte rund um den See und die Dörfer.',
        NL: 'Ontdek meer dan 130 plekken rond het meer en de dorpen.'
      }
    },
    {
      key: 'evenements',
      icon: '📅',
      title: { FR: 'Évènements locaux', EN: 'Local events', DE: 'Lokale Veranstaltungen', NL: 'Lokale evenementen' },
      desc: {
        FR: 'Tous les évènements du coin, jour par jour, pendant votre séjour.',
        EN: 'All local events, day by day, during your stay.',
        DE: 'Alle Veranstaltungen der Umgebung, Tag für Tag, während Ihres Aufenthalts.',
        NL: 'Alle evenementen in de omgeving, dag na dag, tijdens uw verblijf.'
      }
    },
    {
      key: 'highlights',
      icon: '✨',
      title: { FR: 'Votre programme', EN: 'Your selection', DE: 'Ihr Programm', NL: 'Uw programma' },
      desc: {
        FR: 'Une sélection d’évènements et de lieux rien que pour vous.',
        EN: 'A selection of events and spots picked just for you.',
        DE: 'Eine Auswahl an Veranstaltungen und Orten, nur für Sie zusammengestellt.',
        NL: 'Een selectie van evenementen en plekken speciaal voor u samengesteld.'
      }
    },
    {
      key: 'panorama',
      icon: '🌄',
      title: { FR: 'Panorama 360°', EN: '360° panorama', DE: '360°-Panorama', NL: '360°-panorama' },
      desc: {
        FR: 'Repérez les logements et les environs en vue à 360°, et bien plus à découvrir…',
        EN: 'Spot the homes and surroundings in 360° view, and much more to discover…',
        DE: 'Entdecken Sie die Unterkünfte und die Umgebung in der 360°-Ansicht, und vieles mehr…',
        NL: 'Bekijk de woningen en de omgeving in 360°-weergave, en nog veel meer…'
      }
    },
    {
      key: 'backintime',
      icon: '🕰️',
      title: { FR: 'Retour vers le futur', EN: 'Back to the future', DE: 'Zurück in die Zukunft', NL: 'Terug naar de toekomst' },
      desc: {
        FR: 'Remontez le temps et comparez le village et le lac d’hier à aujourd’hui.',
        EN: 'Travel back in time and compare the village and the lake, then and now.',
        DE: 'Reisen Sie in der Zeit zurück und vergleichen Sie das Dorf und den See von früher mit heute.',
        NL: 'Reis terug in de tijd en vergelijk het dorp en het meer van vroeger met nu.'
      },
      href: backInTimeHref()
    }
  ];

  const I18N = {
    heroTitle: { FR: 'Bonjour', EN: 'Hello', DE: 'Hallo', NL: 'Hallo' },
    welcomeGuest: { FR: 'Bonjour', EN: 'Hello', DE: 'Hallo', NL: 'Hallo' },
    heroSubtitle: {
      FR: 'Planifiez vos activités pendant votre séjour.',
      EN: 'Plan your activities during your stay.',
      DE: 'Planen Sie Ihre Aktivitäten während Ihres Aufenthalts.',
      NL: 'Plan uw activiteiten tijdens uw verblijf.'
    },
    seLoger: { FR: 'Se loger', EN: 'Book a stay', DE: 'Unterkunft buchen', NL: 'Verblijf boeken' },
    ouvrir: { FR: 'Ouvrir →', EN: 'Open →', DE: 'Öffnen →', NL: 'Openen →' },
    missing: {
      FR: '⚠️ redirect.js n’a pas pu être chargé, ou cette réservation est introuvable — les liens ci-dessous peuvent être incomplets.',
      EN: '⚠️ redirect.js could not be loaded, or this reservation was not found — the links below may be incomplete.',
      DE: '⚠️ redirect.js konnte nicht geladen werden, oder diese Reservierung wurde nicht gefunden — die untenstehenden Links können unvollständig sein.',
      NL: '⚠️ redirect.js kon niet worden geladen, of deze reservering werd niet gevonden — de onderstaande links kunnen onvolledig zijn.'
    }
  };

  document.documentElement.lang = lang.toLowerCase();
  document.getElementById('btn-selogers-label').textContent = I18N.seLoger[lang];
  document.getElementById('hero-title').textContent = todaysGuestName
    ? `${I18N.welcomeGuest[lang]} ${todaysGuestName}`
    : I18N.heroTitle[lang];
  document.getElementById('hero-subtitle').textContent = I18N.heroSubtitle[lang];
  document.getElementById('lang-select').value = lang;

  if (listing) {
    document.getElementById('label-title').textContent = listing.brand ? (listing.brand[lang] || listing.brand.FR) : listing.id;
    const logoEl = document.getElementById('topbar-logo');
    if (listing.logo) { logoEl.src = listing.logo; logoEl.classList.remove('hidden'); }
  }

  if (!reservationData || !Object.keys(reservationData).length) {
    const missingEl = document.getElementById('data-missing');
    missingEl.textContent = I18N.missing[lang];
    missingEl.style.display = 'block';
  }

  const grid = document.getElementById('tile-grid');
  TILES.forEach(t => {
    // "href" precalcule (ex. backintime, qui ne depend pas de redirect.js) prioritaire
    // sur la valeur stockee dans redirect.js pour cette reservation.
    const href = t.href || reservationData[t.key];
    const a = document.createElement('a');
    a.className = 'tile' + (href ? '' : ' disabled');
    a.href = href || '#';
    a.innerHTML = `
      <div class="tile-icon">${t.icon}</div>
      <div class="tile-title">${t.title[lang]}</div>
      <div class="tile-desc">${t.desc[lang]}</div>
      <div class="tile-arrow">${I18N.ouvrir[lang]}</div>
    `;
    grid.appendChild(a);
  });

  document.getElementById('lang-select').addEventListener('change', (e) => {
    const p = new URLSearchParams(window.location.search);
    p.set('lang', e.target.value);
    window.location.search = p.toString();
  });
})();
</script>
</body>
</html>
