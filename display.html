<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Redirection Bello</title>
    
    <script src="redirect.js"></script>

    <script>
        // L'URL vers laquelle rediriger s'il n'y a pas de code ou s'il est introuvable
        const urlParDefaut = "index.html";

        // Récupération des paramètres de l'URL
        const urlParams = new URLSearchParams(window.location.search);
        // S'il n'y a pas de "res" précisé (ex: ?action=parking tout seul), on retombe
        // sur l'entrée "default" de redirect.js plutôt que sur urlParDefaut directement.
        const numeroReservation = urlParams.get('res') || 'default';

        // On récupère maintenant le paramètre "action" (ex: ?res=12345&action=url2)
        // S'il n'y a pas d'action précisée, on prend "default" par défaut
        const typeAction = urlParams.get('action') || 'default';

        // On initialise la destination avec l'URL par défaut
        let urlDestination = urlParDefaut;

        // Si un numéro est fourni et que le fichier de conf est bien chargé
        if (numeroReservation && typeof reservations !== 'undefined') {

            const donneesReservation = reservations[numeroReservation];

            // Si la réservation existe ET que l'action demandée existe dans redirect.js
            if (donneesReservation && donneesReservation[typeAction]) {
                // On remplace l'URL par défaut par la bonne URL trouvée
                urlDestination = donneesReservation[typeAction];
            }
        }

        // On transmet aussi tout paramètre supplémentaire présent sur le lien display.html
        // (autre que res/action) vers la page de destination, sans écraser ceux déjà fixés
        // dans redirect.js. Utile pour des tags génériques comme "today" (voir redirect.js) :
        // ex. display.html?res=today&action=highlights&logement=moustiers permet de choisir
        // le logement sur un lien qui n'en fixe pas un par défaut.
        const passthrough = new URLSearchParams(urlParams);
        passthrough.delete('res');
        passthrough.delete('action');
        if ([...passthrough.keys()].length) {
            const [baseUrl, existingQuery] = urlDestination.split('?');
            const destParams = new URLSearchParams(existingQuery || '');
            for (const [cle, valeur] of passthrough.entries()) {
                if (!destParams.has(cle)) destParams.set(cle, valeur);
            }
            const destQuery = destParams.toString();
            urlDestination = destQuery ? `${baseUrl}?${destQuery}` : baseUrl;
        }

        // Tracking GA4 avant redirection, sans jamais la retarder : display.html ne charge
        // pas analytics.js (gtag.js n'aurait de toute facon pas le temps de se charger avant
        // le window.location.replace ci-dessous). On envoie donc un hit "brut" via l'API
        // Measurement Protocol de GA4 en sendBeacon (appel synchrone, non-bloquant, et dont
        // le navigateur garantit l'envoi meme si la page se ferme juste apres).
        (function () {
            try {
                const GA_MEASUREMENT_ID = "G-DNTYRENFNL"; // meme propriete GA4 que analytics.js
                const GA_API_SECRET = "RcYgy0FvT8WMP66lBWjBaw";

                // Reutilise le client_id existant (cookie _ga, pose par gtag.js sur les
                // autres pages du site) pour rattacher ce hit au meme visiteur/session ;
                // sinon on en genere un nouveau pour ce hit isole.
                function getGaClientId() {
                    const match = document.cookie.match(/(?:^|;\s*)_ga=([^;]+)/);
                    if (match) {
                        const parts = decodeURIComponent(match[1]).split('.');
                        if (parts.length >= 4) return parts.slice(-2).join('.');
                    }
                    return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + '.' + Math.random().toString(36).slice(2));
                }

                const payload = {
                    client_id: getGaClientId(),
                    events: [{
                        name: 'redirect_click',
                        params: {
                            reservation_code: numeroReservation,
                            action: typeAction,
                            destination_url: urlDestination,
                            page_location: window.location.href,
                            engagement_time_msec: '1'
                        }
                    }]
                };

                const beaconUrl = `https://www.google-analytics.com/mp/collect?measurement_id=${GA_MEASUREMENT_ID}&api_secret=${GA_API_SECRET}`;
                navigator.sendBeacon(beaconUrl, JSON.stringify(payload));
            } catch (e) {
                // Le tracking ne doit jamais empecher la redirection.
            }
        })();

        // On effectue la redirection dans tous les cas
        window.location.replace(urlDestination);
    </script>
</head>
<body>
</body>
</html>
