						<div class="f-bymonthday-wrap"><span class="ef-label">${L.fByMonthDay}</span><input type="number" min="1" max="31" class="f-rec-bymonthday"></div>
						<div class="f-byday-wrap" style="grid-column:1 / -1;"><span class="ef-label">${L.fByDay}</span><div class="byday-grid"></div></div>
						<div><span class="ef-label">${L.fStart}</span><input type="date" class="f-rec-start"></div>
						<div><span class="ef-label">${L.fEnd}</span><input type="date" class="f-rec-end"></div>
					</div>
				</div>
				<div class="ef-grid">
					<div><span class="ef-label">${L.fTimeFr}</span><input type="text" class="f-time-fr"></div>
					<div><span class="ef-label">${L.fTimeEn}</span><input type="text" class="f-time-en"></div>
				</div>
				<div class="ef-grid">
					<div><span class="ef-label">${L.fTitleFr} *</span><input type="text" class="f-title-fr"></div>
					<div><span class="ef-label">${L.fTitleEn}</span><input type="text" class="f-title-en"></div>
				</div>
				<div class="ef-grid">
					<div><span class="ef-label">${L.fDetailsFr}</span><textarea class="f-details-fr"></textarea></div>
					<div><span class="ef-label">${L.fDetailsEn}</span><textarea class="f-details-en"></textarea></div>
				</div>
				<div class="ef-grid">
					<div><span class="ef-label">${L.fImg}</span><input type="text" class="f-img" placeholder="https://bellodulac.netlify.app/images/mon-evenement.jpg"></div>
				</div>
				<div class="ef-grid-3" style="align-items:end;">
					<div><span class="ef-label">${L.fUrl}</span><input type="text" class="f-url"></div>
					<label class="ef-checkline" style="padding-bottom:6px;"><input type="checkbox" class="f-favorite"> ${L.fFavorite}</label>
					<div><span class="ef-label">${L.fRating}</span>
						<select class="f-rating"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
					</div>
				</div>
			`;

			// ---- remplissage des valeurs via le DOM (jamais d'interpolation de contenu utilisateur dans le HTML) ----
			const timeLoc = locGet(evt.time);
			const titleLoc = locGet(evt.title);
			const detailsLoc = locGet(evt.details);

			$('.f-id', wrap).value = evt.id || '';
			$('.f-cat', wrap).value = evt.cat || (cfg.categories[0] && cfg.categories[0].id) || '';
			$('.f-place', wrap).value = evt.place || '';
			$('.f-time-fr', wrap).value = timeLoc.fr;
			$('.f-time-en', wrap).value = timeLoc.en;
			$('.f-title-fr', wrap).value = titleLoc.fr;
			$('.f-title-en', wrap).value = titleLoc.en;
			$('.f-details-fr', wrap).value = detailsLoc.fr;
			$('.f-details-en', wrap).value = detailsLoc.en;
			$('.f-img', wrap).value = evt.img || '';
			$('.f-url', wrap).value = evt.url || '';
			$('.f-favorite', wrap).checked = !!evt.favorite;
			$('.f-rating', wrap).value = String(evt.rating || 0);

			$('.f-date', wrap).value = evt.date || '';
			const rec = evt.recurrence || {};
			$('.f-rec-freq', wrap).value = rec.freq || 'weekly';
			$('.f-rec-interval', wrap).value = rec.interval || 1;
			$('.f-rec-bymonthday', wrap).value = rec.byMonthDay || '';
			$('.f-rec-start', wrap).value = rec.startDate || '';
			$('.f-rec-end', wrap).value = rec.endDate || '';

			const bydayWrap = $('.byday-grid', wrap);
			const bydaySelected = new Set(rec.byDay || []);
			WEEKDAY_CODES.forEach(code => {
				const chip = document.createElement('button');
				chip.type = 'button';
				chip.className = 'byday-chip' + (bydaySelected.has(code) ? ' active' : '');
				chip.textContent = L.byDayShort[code];
				chip.dataset.code = code;
				chip.addEventListener('click', () => {
					chip.classList.toggle('active');
					syncRowToModel(wrap, idx);
				});
				bydayWrap.appendChild(chip);
			});

			function updateFreqFieldsVisibility() {
				const freq = $('.f-rec-freq', wrap).value;
				$('.f-byday-wrap', wrap).style.display = freq === 'weekly' ? '' : 'none';
				$('.f-bymonthday-wrap', wrap).style.display = freq === 'monthly' ? '' : 'none';
			}
			function setType(type) {
				$$('.f-type-btn', wrap).forEach(b => b.classList.toggle('active', b.dataset.type === type));
				$('.f-date-fields', wrap).style.display = type === 'date' ? '' : 'none';
				$('.f-rec-fields', wrap).style.display = type === 'rec' ? 'grid' : 'none';
				updateFreqFieldsVisibility();
			}
			setType(evt.recurrence ? 'rec' : 'date');

			function setLogement(val) {
				$$('.f-logement-btn', wrap).forEach(b => b.classList.toggle('active', b.dataset.logement === val));
			}
			setLogement(evt.logement || 'both');
			$$('.f-logement-btn', wrap).forEach(btn => {
				btn.addEventListener('click', () => { setLogement(btn.dataset.logement); syncRowToModel(wrap, idx); });
			});

			$$('.f-type-btn', wrap).forEach(btn => {
				btn.addEventListener('click', () => { setType(btn.dataset.type); syncRowToModel(wrap, idx); });
			});
			$('.f-rec-freq', wrap).addEventListener('change', () => { updateFreqFieldsVisibility(); syncRowToModel(wrap, idx); });

			$$('input, select, textarea', wrap).forEach(el => {
				el.addEventListener('input', () => syncRowToModel(wrap, idx));
				el.addEventListener('change', () => syncRowToModel(wrap, idx));
			});

			const selectCb = $('.f-select-hl', wrap);
			if (selectCb) {
				selectCb.checked = state.editSelectedHl.has(evt.__uid);
				selectCb.addEventListener('click', (e) => e.stopPropagation());
				selectCb.addEventListener('change', () => {
					if (selectCb.checked) state.editSelectedHl.add(evt.__uid);
					else state.editSelectedHl.delete(evt.__uid);
					updateCopyHighlightsLabel();
				});
			}

			$('.btn-del-event', wrap).addEventListener('click', () => {
				if (window.confirm(L.deleteEvent)) {
					state.editSelectedHl.delete(evt.__uid);
					state.editEvents.splice(idx, 1);
					renderEditList();
				}
			});

			$('.btn-dup-event', wrap).addEventListener('click', () => {
				duplicateEventRow(idx);
			});

			return wrap;
		}

		// duplique un evenement (ponctuel ou recurrent) a l'identique, seule la date est a modifier :
		// le nouvel evenement est insere juste apres l'original, sans id (regenere a la validation), et
		// le focus se place directement sur le champ date pour que l'utilisateur n'ait plus qu'a la changer.
		function duplicateEventRow(idx) {
			const original = state.editEvents[idx];
			if (!original) return;
			const clone = JSON.parse(JSON.stringify(original));
			clone.__uid = nextUid();
			clone.id = '';
			state.editEvents.splice(idx + 1, 0, clone);
			renderEditList();
			setTimeout(() => {
				const row = $(`.edit-row[data-uid="${clone.__uid}"]`, $('#edit-list'));
				if (row && typeof row.scrollIntoView === 'function') row.scrollIntoView({ behavior: 'smooth', block: 'start' });
				const dateInput = row && (clone.recurrence ? $('.f-rec-start', row) : $('.f-date', row));
				if (dateInput) {
					if (typeof dateInput.focus === 'function') dateInput.focus();
					if (typeof dateInput.select === 'function') dateInput.select();
				}
			}, 50);
		}

		// recopie les valeurs saisies dans state.editEvents[idx], sans redessiner la ligne
		// (pour ne pas perdre le focus / la position du curseur pendant la saisie)
		function syncRowToModel(wrap, idx) {
			const evt = state.editEvents[idx];
			if (!evt) return;

			evt.id = $('.f-id', wrap).value.trim();
			evt.cat = $('.f-cat', wrap).value;
			evt.place = $('.f-place', wrap).value.trim();
			evt.favorite = $('.f-favorite', wrap).checked;
			evt.rating = parseInt($('.f-rating', wrap).value, 10) || 0;

			const activeLogement = $$('.f-logement-btn', wrap).find(b => b.classList.contains('active'));
			evt.logement = activeLogement ? activeLogement.dataset.logement : 'both';

			const urlVal = $('.f-url', wrap).value.trim();
			if (urlVal) evt.url = urlVal; else delete evt.url;

			const imgVal = $('.f-img', wrap).value.trim();
			if (imgVal) evt.img = imgVal; else delete evt.img;

			evt.time = locPack($('.f-time-fr', wrap).value, $('.f-time-en', wrap).value);
			evt.title = locPack($('.f-title-fr', wrap).value, $('.f-title-en', wrap).value);
			evt.details = locPack($('.f-details-fr', wrap).value, $('.f-details-en', wrap).value);

			const activeType = $$('.f-type-btn', wrap).find(b => b.classList.contains('active'));
			const isRec = activeType && activeType.dataset.type === 'rec';

			if (isRec) {
				delete evt.date;
				const freq = $('.f-rec-freq', wrap).value;
				const rec = {
					freq,
					interval: parseInt($('.f-rec-interval', wrap).value, 10) || 1,
					startDate: $('.f-rec-start', wrap).value || null,
					endDate: $('.f-rec-end', wrap).value || null
				};
				if (freq === 'weekly') {
					rec.byDay = $$('.byday-chip', wrap).filter(c => c.classList.contains('active')).map(c => c.dataset.code);
				}
				if (freq === 'monthly') {
					rec.byMonthDay = parseInt($('.f-rec-bymonthday', wrap).value, 10) || 1;
				}
				evt.recurrence = rec;
			} else {
				delete evt.recurrence;
				evt.date = $('.f-date', wrap).value || '';
			}
		}

		function addEventRow() {
			const data = window.EVENTS_DATA;
			const cfg = getConfig(data);
			const newEvt = {
				__uid: nextUid(),
				id: '',
				cat: (cfg.categories[0] && cfg.categories[0].id) || '',
				place: '',
				logement: 'both',
				time: '',
				title: '',
				details: '',
				favorite: false,
				rating: 0,
				date: toISO(startOfToday())
			};
			state.editEvents.push(newEvt);
			renderEditList();
			setTimeout(() => {
				const rows = $$('.edit-row', $('#edit-list'));
				const last = rows[rows.length - 1];
				if (last && typeof last.scrollIntoView === 'function') last.scrollIntoView({ behavior: 'smooth', block: 'start' });
				const firstInput = last && $('.f-title-fr', last);
				if (firstInput && typeof firstInput.focus === 'function') firstInput.focus();
			}, 50);
		}

		function validateEditEvents() {
			const L = I18N[state.lang];
			const ids = new Set();
			for (const evt of state.editEvents) {
				const titleLoc = locGet(evt.title);
				if (!titleLoc.fr) {
					window.alert(L.requireTitle + (evt.place ? ' (' + evt.place + ')' : ''));
					return false;
				}
				if (!evt.date && !evt.recurrence) {
					window.alert(L.requireDateOrRec + ' (' + titleLoc.fr + ')');
					return false;
				}
				if (!evt.id) evt.id = 'evt-' + Math.random().toString(36).slice(2, 8);
				if (ids.has(evt.id)) {
					window.alert(L.duplicateId + evt.id);
					return false;
				}
				ids.add(evt.id);
			}
			return true;
		}

		// construit le contenu texte du fichier evenements.js a partir des donnees courantes
		function buildExportContent() {
			const data = window.EVENTS_DATA;
			const sourceEvents = state.editEvents || data.events || [];
			const events = sourceEvents.map(evt => {
				const clean = Object.assign({}, evt);
				delete clean.__uid;
				delete clean.recurring;
				if (clean.recurrence) delete clean.date;
				else delete clean.recurrence;
				if (!clean.url) delete clean.url;
				if (!clean.img) delete clean.img;
				return clean;
			});

			const configOut = Object.assign({}, data.config, {
				dayColors: state.editDayColors || (data.config && data.config.dayColors) || DEFAULT_DAY_PALETTE.slice()
			});

			const out = {
				config: configOut,
				categories: data.categories,
				distances: data.distances,
				events
			};

			return '// Genere automatiquement depuis le mode edition de evenements.html.\n' +
				'// Derniere generation : ' + new Date().toISOString() + '\n' +
				'window.EVENTS_DATA = ' + JSON.stringify(out, null, 2) + ';\n';
		}

		function downloadEvenementsJs() {
			if (!validateEditEvents()) return;
			renderEditList();
			const content = buildExportContent();
			const blob = new Blob([content], { type: 'text/javascript;charset=utf-8' });
			const url = URL.createObjectURL(blob);
			const a = document.createElement('a');
			a.href = url;
			a.download = 'evenements.js';
			document.body.appendChild(a);
			a.click();
			document.body.removeChild(a);
			setTimeout(() => URL.revokeObjectURL(url), 2000);
		}


		function init() {
			readUrlParams();

			function start() {
				const data = window.EVENTS_DATA;
				if (data) buildFilterBar(getConfig(data));
				updateMonthcalLabels();
				renderActiveView();
				syncUrl();

				$('#lang-select').addEventListener('change', (e) => {
					state.lang = e.target.value;
					buildFilterBar(getConfig(window.EVENTS_DATA));
					updateMonthcalLabels();
					if (state.editMode) renderEditList(); else renderActiveView();
					syncUrl();
				});

				$('#btn-month-calendar').addEventListener('click', openMonthCalendar);
				$('#btn-monthcal-close').addEventListener('click', closeMonthCalendar);
				$('#btn-monthcal-prev').addEventListener('click', () => shiftMonthCalendar(-1));
				$('#btn-monthcal-next').addEventListener('click', () => shiftMonthCalendar(1));
				$('#btn-monthcal-print').addEventListener('click', () => window.print());
				$('#btn-monthcal-fullscreen').addEventListener('click', toggleMonthcalFullscreen);
				document.addEventListener('keydown', (e) => {
					if (e.key === 'Escape' && $('#view-monthcal').classList.contains('monthcal-fullscreen')) {
						toggleMonthcalFullscreen();
					}
				});

				$('#btn-copy-selection').addEventListener('click', copySelectionLink);

				if (window.EDIT_MODE) {
					$('#btn-edit-toggle').addEventListener('click', toggleEditMode);
					$('#btn-add-event').addEventListener('click', addEventRow);
					$('#btn-download-json').addEventListener('click', downloadEvenementsJs);
					$('#btn-copy-highlights').addEventListener('click', copyHighlightsLink);
				} else {
					// EDIT_MODE desactive : le bouton d'edition est totalement retire de la page.
					$('#btn-edit-toggle').remove();
				}
			}

			if (window.EVENTS_DATA) {
				start();
			} else {
				// evenements.js vit desormais dans le meme repo que cette page (charge en
				// <script>, comme pois.js/logements.js) : plus besoin de gist externe ni
				// de repli, EXTERNAL_URL et LOCAL_URL pointent tous les deux vers le fichier local.
				const EXTERNAL_URL = "evenements.js";
				const LOCAL_URL = "evenements.js";

				function loadLocal() {
					const s = document.createElement('script');
					s.src = LOCAL_URL;
					s.onload = start;
					s.onerror = () => console.error("Impossible de charger evenements.js");
					document.head.appendChild(s);
				}

				if (EXTERNAL_URL) {
					const s = document.createElement('script');
					s.src = EXTERNAL_URL;
					s.onload = start;
					s.onerror = loadLocal;
					document.head.appendChild(s);
				} else {
					loadLocal();
				}
			}
		}

		// Chargement de logements.js (source de verite du logement par defaut), avant meme
		// readUrlParams() : DEFAULT_SECTEUR doit etre a jour avant toute lecture de l'URL.
		// Repli local si l'URL externe echoue (meme schema que pois.js/evenements.js) ; en
		// dernier recours le DEFAULT_SECTEUR code en dur ci-dessus reste utilise.
		function chargerLogementsPuisInit() {
			function proceed() {
				if (window.LOGEMENTS_DATA && window.LOGEMENTS_DATA.default) {
					DEFAULT_LISTING_ID = window.LOGEMENTS_DATA.default.toString();
					DEFAULT_SECTEUR = DEFAULT_LISTING_ID.toLowerCase().includes('moustiers') ? 'moustiers' : 'salles';
				}
				init();
			}
			if (window.LOGEMENTS_DATA) { proceed(); return; }

			const EXTERNAL_URL = "logements.js";
			const LOCAL_URL = "logements.js";

			function loadLocal() {
				const s = document.createElement('script');
				s.src = LOCAL_URL;
				s.onload = proceed;
				s.onerror = () => { console.error("Impossible de charger logements.js"); proceed(); };
				document.head.appendChild(s);
			}

			const s = document.createElement('script');
			s.src = EXTERNAL_URL;
			s.onload = proceed;
			s.onerror = loadLocal;
			document.head.appendChild(s);
		}

		document.addEventListener('DOMContentLoaded', chargerLogementsPuisInit);
	})();

	</script>
	</body>
	</html>
